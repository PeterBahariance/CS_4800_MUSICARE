<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Musicare</title>
    <link rel="stylesheet" href="signup_styles.css">

</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-header">
            <h1>Create Your Account</h1>
            <p>Join Musicare and start your music therapy journey</p>
        </div>
        
        <!-- Progress Bar -->
        <div class="progress-bar">
            <div class="progress-fill" style="width: 50%;"></div>
        </div>
        <div class="step-indicator">
            <span class="step active">1. Account</span>
            <span class="step">2. Preferences</span>
        </div>

        <form id="enhanced-signup-form">
            <!-- Step 1: Account Info -->
            <div class="form-step active" data-step="1">
                <h3>Account Information</h3>
                <div class="form-group">
                    <label for="email">Email Address *</label>
                    <input type="email" id="email" class="form-control" placeholder="your.email@example.com" required>
                </div>
                
                <div class="form-group">
                    <label for="username">Username *</label>
                    <input type="text" id="username" class="form-control" placeholder="@username" required>
                    <small>This will be your unique handle</small>
                </div>
                
                <div class="form-group">
                    <label for="password">Password *</label>
                    <input type="password" id="password" class="form-control" placeholder="Min 6 characters" required>
                </div>
                
                <div class="form-group">
                    <label for="confirm-password">Confirm Password *</label>
                    <input type="password" id="confirm-password" class="form-control" placeholder="Confirm password" required>
                </div>
                
                <button type="button" class="btn btn-primary btn-block next-step">Next Step →</button>
            </div>

            <!-- Step 2: Health & Music Preferences -->
            <div class="form-step" data-step="2">
                <h3>Health & Music Preferences</h3>
                
                <div class="form-group">
                    <label>Health Goals (select all that apply)</label>
                    <div id="healthGoalsContainer" class="checkbox-grid"></div>
                </div>
                
                <div class="form-group">
                    <label>Music Preferences (select your favorites)</label>
                    <div id="musicPreferencesContainer" class="checkbox-grid"></div>
                </div>
                
                <div class="form-group">
                    <label for="dailyListeningGoal">Daily Listening Goal (minutes)</label>
                    <input type="number" id="dailyListeningGoal" class="form-control" placeholder="e.g., 30" min="5" max="300">
                </div>
                
                <div class="btn-group">
                    <button type="button" class="btn btn-secondary prev-step">← Back</button>
                    <button type="submit" class="btn btn-primary btn-block">Create Account</button>
                </div>
            </div>
            
            <div class="error-message" id="signup-error" style="margin: 1rem 0; text-align: center;"></div>
            <div class="success-message" id="signup-success" style="display: none;"></div>
            
            <div class="back-to-login">
                <a href="index.html">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    Back to Login
                </a>
            </div>
        </form>
    </div>

    <!-- Enhanced signup script -->
    <script type="module" src="/src/pages/signup.js"></script>
</body>
</html>
