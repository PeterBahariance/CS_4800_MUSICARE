<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - MusiCare</title>
    <link rel="stylesheet" href="/styles.css">
    <style>
        .dashboard-container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 2rem;
            text-align: center;
        }
        .user-info {
            margin: 2rem 0;
            padding: 1rem;
            background: #f5f5f5;
            border-radius: 8px;
        }
        .btn {
            display: inline-block;
            padding: 0.5rem 1rem;
            background: #dc3545;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            margin-top: 1rem;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <h1>Welcome to Your Dashboard</h1>
        <div class="user-info">
            <p>You are logged in as: <span id="user-email">Loading...</span></p>
            <button id="sign-out-btn" class="btn">Sign Out</button>
        </div>
    </div>

    <script type="module">
        import { getAuth, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/9.6.0/firebase-auth.js';
        import { firebaseConfig } from '/src/firebase/firebase-config.js';
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.6.0/firebase-app.js';

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Update UI based on auth state
        onAuthStateChanged(auth, (user) => {
            const userEmail = document.getElementById('user-email');
            const signOutBtn = document.getElementById('sign-out-btn');

            if (user) {
                // User is signed in
                userEmail.textContent = user.email;
            } else {
                // User is signed out, redirect to index.html
                window.location.href = 'index.html';
            }
        });

        // Sign out button handler
        document.getElementById('sign-out-btn').addEventListener('click', async () => {
            try {
                await signOut(auth);
                // onAuthStateChanged will handle the redirect
            } catch (error) {
                console.error('Sign out error:', error);
                alert('Error signing out: ' + error.message);
            }
        });
    </script>
</body>
</html>
