<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musicare - Music for Health &amp; Well-being</title>
    <link rel="stylesheet" href="index_css.css">
</head>

<body>
        <!-- Header Wrapper -->
        <div class="header-wrapper">
            <header class="auth-header">
                <div class="logo">Musicare</div>
                <nav>
                    <a href="#" class="btn btn-outline">Sign In</a>
                </nav>
            </header>
        </div>

        <!-- Auth Container Wrapper -->
        <div class="auth-container-wrapper">
            <div class="auth-container">

                <div class="auth-header">
                    <h1>Welcome to Musicare</h1>
                    <p>Your personal music therapy companion</p>
                </div>

                <!-- Login Container -->
                <div id="login-container">
                    <form id="login-form">

                        <div class="form-group">
                            <label for="login-email">Email Address</label>
                            <input type="email" id="login-email" class="form-control" placeholder="Enter your email" required>
                            <div class="error-message" id="login-email-error"></div>
                        </div>

                        <div class="form-group">
                            <label for="login-password">Password</label>
                            <input type="password" id="login-password" class="form-control" placeholder="Enter your password" required>
                            <div class="error-message" id="login-password-error"></div>
                        </div>

                        <button type="submit" class="btn btn-primary btn-block">Log In</button>

                        <div class="error-message" id="login-error" style="margin: 1rem 0; text-align: center;"></div>

                        <!-- Success Message -->
                        <div id="signup-success" class="success-message" style="display: none; margin: 1rem 0; padding: 0.75rem; background-color: #d4edda; color: #155724; border-radius: 4px; text-align: center;">
                            <span id="success-message">Account created successfully! Please log in.</span>
                            <div class="spinner-border spinner-border-sm text-success ms-2" role="status" style="vertical-align: middle;">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </div>

                        <div class="auth-footer">
                            <p>Don't have an account? <a href="signup.html" id="show-signup">Create account</a></p>
                        </div>

                    </form>
                </div>

            </div>
        </div>

    <!-- Main app entry point -->
    <script type="module" src="./src/auth/index.js"></script>

</body>
</html>
