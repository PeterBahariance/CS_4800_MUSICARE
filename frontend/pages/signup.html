<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Musicare</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --primary-dark: #357abd;
            --background: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --text-light: #7f8c8d;
            --border-color: #e1e4e8;
            --error-color: #e74c3c;
            --success-color: #2ecc71;
            --shadow: 0 2px 10px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .auth-container {
            max-width: 500px;
            width: 90%;
            margin: 2rem auto;
            padding: 2.5rem;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-header h1 {
            color: var(--primary-color);
            margin-bottom: 0.75rem;
            font-size: 2.2rem;
            font-weight: 300;
            letter-spacing: -0.5px;
        }

        .auth-header p {
            color: var(--text-light);
            margin: 0;
            font-size: 1.1rem;
            font-weight: 300;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-color);
            font-weight: 500;
            font-size: 0.95rem;
        }

        .form-control {
            width: 100%;
            padding: 0.85rem 1.25rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: white;
            color: var(--text-color);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.2);
        }

        .btn {
            display: inline-block;
            padding: 0.85rem 1.5rem;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 500;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background-color: #4a90e2; /* Direct color value */
            color: white !important;
            border: none;
            border-radius: 6px;
            padding: 0.85rem 1.5rem;
            font-weight: 500;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
            display: block;
            width: 100%;
            text-align: center;
        }

        .btn-primary:hover {
            background-color: #357abd; /* Slightly darker blue */
        }

        .btn-block {
            display: block;
            width: 100%;
            padding: 0.85rem 1.25rem;
        }

        .error-message {
            color: var(--error-color);
            font-size: 0.85rem;
            margin-top: 0.5rem;
            display: none;
            font-weight: 500;
        }

        .back-to-login {
            margin-top: 1.5rem;
            text-align: center;
        }

        .back-to-login a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
        }

        .back-to-login a svg {
            margin-right: 0.5rem;
        }

        /* Success message */
        .success-message {
            background-color: rgba(46, 204, 113, 0.1);
            color: var(--success-color);
            padding: 12px;
            border-radius: 6px;
            margin: 1rem 0;
            text-align: center;
            border: 1px solid rgba(46, 204, 113, 0.3);
        }

        /* Loading state */
        .btn-loading {
            position: relative;
            pointer-events: none;
            opacity: 0.8;
        }

        .btn-loading:after {
            content: "";
            position: absolute;
            width: 20px;
            height: 20px;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            margin: auto;
            border: 3px solid transparent;
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: button-loading-spinner 1s ease infinite;
        }

        @keyframes button-loading-spinner {
            from { transform: rotate(0turn); }
            to { transform: rotate(1turn); }
        }

        /* Multi-step form styles */
        .progress-bar {
            width: 100%;
            height: 4px;
            background: var(--border-color);
            border-radius: 2px;
            margin-bottom: 1rem;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary-color);
            transition: width 0.3s ease;
        }

        .step-indicator {
            display: flex;
            justify-content: space-between;
            margin-bottom: 2rem;
            font-size: 0.85rem;
        }

        .step-indicator .step {
            color: var(--text-light);
            transition: color 0.3s ease;
        }

        .step-indicator .step.active {
            color: var(--primary-color);
            font-weight: 600;
        }

        .form-step {
            display: none;
        }

        .form-step.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .form-step h3 {
            margin-bottom: 1.5rem;
            color: var(--text-color);
            font-size: 1.3rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .btn-group {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .btn-secondary {
            background-color: var(--border-color);
            color: var(--text-color);
        }

        .btn-secondary:hover {
            background-color: #d1d5db;
        }

        .checkbox-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 0.75rem;
            margin-top: 0.5rem;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            padding: 0.5rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .checkbox-label:hover {
            border-color: var(--primary-color);
            background: rgba(74, 144, 226, 0.05);
        }

        .checkbox-label input[type="checkbox"] {
            margin-right: 0.5rem;
            cursor: pointer;
        }

        .checkbox-label input[type="checkbox"]:checked + span {
            color: var(--primary-color);
            font-weight: 500;
        }

        textarea.form-control {
            resize: vertical;
            min-height: 80px;
        }

        small {
            display: block;
            margin-top: 0.25rem;
            color: var(--text-light);
            font-size: 0.85rem;
        }
    </style>
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-header">
            <h1>Create Your Account</h1>
            <p>Join Musicare and start your music therapy journey</p>
        </div>
        
        <!-- Progress Bar -->
        <div class="progress-bar">
            <div class="progress-fill" style="width: 50%;"></div>
        </div>
        <div class="step-indicator">
            <span class="step active">1. Account</span>
            <span class="step">2. Preferences</span>
        </div>

        <form id="enhanced-signup-form">
            <!-- Step 1: Account Info -->
            <div class="form-step active" data-step="1">
                <h3>Account Information</h3>
                <div class="form-group">
                    <label for="email">Email Address *</label>
                    <input type="email" id="email" class="form-control" placeholder="your.email@example.com" required>
                </div>
                
                <div class="form-group">
                    <label for="username">Username *</label>
                    <input type="text" id="username" class="form-control" placeholder="@username" required>
                    <small>This will be your unique handle</small>
                </div>
                
                <div class="form-group">
                    <label for="password">Password *</label>
                    <input type="password" id="password" class="form-control" placeholder="Min 6 characters" required>
                </div>
                
                <div class="form-group">
                    <label for="confirm-password">Confirm Password *</label>
                    <input type="password" id="confirm-password" class="form-control" placeholder="Confirm password" required>
                </div>
                
                <button type="button" class="btn btn-primary btn-block next-step">Next Step →</button>
            </div>

            <!-- Step 2: Health & Music Preferences -->
            <div class="form-step" data-step="2">
                <h3>Health & Music Preferences</h3>
                
                <div class="form-group">
                    <label>Health Goals (select all that apply)</label>
                    <div id="healthGoalsContainer" class="checkbox-grid"></div>
                </div>
                
                <div class="form-group">
                    <label>Music Preferences (select your favorites)</label>
                    <div id="musicPreferencesContainer" class="checkbox-grid"></div>
                </div>
                
                <div class="form-group">
                    <label for="dailyListeningGoal">Daily Listening Goal (minutes)</label>
                    <input type="number" id="dailyListeningGoal" class="form-control" placeholder="e.g., 30" min="5" max="300">
                </div>
                
                <div class="btn-group">
                    <button type="button" class="btn btn-secondary prev-step">← Back</button>
                    <button type="submit" class="btn btn-primary btn-block">Create Account</button>
                </div>
            </div>
            
            <div class="error-message" id="signup-error" style="margin: 1rem 0; text-align: center;"></div>
            <div class="success-message" id="signup-success" style="display: none;"></div>
            
            <div class="back-to-login">
                <a href="index.html">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    Back to Login
                </a>
            </div>
        </form>
    </div>

    <!-- Enhanced signup script -->
    <script type="module" src="/src/auth/signup.js"></script>
</body>
</html>
